<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — TradeBridge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0D0610;--bg2:#150A1A;--card:#1A0E20;--wine:#6B1D3A;--gold:#C9A84C;--gold-l:#E2C97E;--txt:#F5EEF2;--txt2:#B8A5B0;--muted:#7A6B74;--glass-b:rgba(201,168,76,0.1);--green:#4ADE80;--red:#F87171}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2rem;position:relative;overflow-x:hidden;overflow-y:auto}

  .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .particle{position:absolute;border-radius:50%;opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

  .glow{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
  .glow1{width:500px;height:500px;background:radial-gradient(circle,rgba(107,29,58,0.2),transparent 70%);top:-10%;left:-5%}
  .glow2{width:400px;height:400px;background:radial-gradient(circle,rgba(201,168,76,0.06),transparent 70%);bottom:-5%;right:-5%}

  .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center}
  .logo{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.3rem;text-align:center}
  .logo-sub{font-size:0.65rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2.5rem}
  .box{background:var(--card);border:1px solid var(--glass-b);border-radius:20px;padding:2.5rem;width:100%;max-width:420px;backdrop-filter:blur(20px);animation:slideUp 0.6s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  h2{font-size:1.3rem;font-weight:700;margin-bottom:0.4rem}
  .sub{font-size:0.88rem;color:var(--muted);margin-bottom:2rem}
  .field{margin-bottom:1.2rem}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--txt2);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em}
  .input-wrap{position:relative}
  .field input{width:100%;padding:0.8rem 1rem;background:var(--bg2);border:1px solid var(--glass-b);border-radius:10px;color:var(--txt);font-size:0.92rem;font-family:inherit;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.08)}
  .field input::placeholder{color:var(--muted)}
  .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px;transition:color 0.2s}
  .toggle-pw:hover{color:var(--txt)}
  .btn{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--bg);font-size:0.95rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-top:0.5rem;transition:transform 0.2s,box-shadow 0.3s}
  .btn:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,0.3)}
  .btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
  .btn:active:not(:disabled){transform:scale(0.98)}
  .msg{text-align:center;margin-top:1rem;font-size:0.85rem;padding:0.6rem;border-radius:8px;display:none;animation:slideUp 0.3s ease}
  .msg.err{display:block;background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.15)}
  .msg.ok{display:block;background:rgba(74,222,128,0.1);color:var(--green);border:1px solid rgba(74,222,128,0.15)}
  .bottom{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--muted)}
  .bottom a{color:var(--gold);font-weight:600;text-decoration:none;transition:color 0.2s}
  .bottom a:hover{color:var(--gold-l)}
  a.back{display:inline-block;margin-bottom:1.5rem;font-size:0.85rem;color:var(--muted);text-decoration:none;transition:color 0.2s}
  a.back:hover{color:var(--txt)}
</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="particles" id="particles"></div>

<div class="content">
<a href="/" class="back">← Back to home</a>
<div class="logo">TradeBridge</div>
<div class="logo-sub">MT5 to MT5 Trade Copier</div>

<div class="box">
  <h2>Welcome back</h2>
  <p class="sub">Log in to your account</p>

  <form onsubmit="login(event)">
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>
    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Your password" required>
        <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
      </div>
    </div>
    <button type="submit" class="btn" id="btn">Log In →</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="bottom">Don't have an account? <a href="/register">Register</a></div>
</div>
</div>

<script>
  // Particles
  (function(){
    const c=document.getElementById('particles');
    for(let i=0;i<15;i++){
      const p=document.createElement('div');
      p.className='particle';
      const s=Math.random()*3+1;
      p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${Math.random()>0.5?'rgba(201,168,76,0.4)':'rgba(107,29,58,0.5)'};animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*5}s`;
      c.appendChild(p);
    }
  })();

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = event.currentTarget;
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  async function login(e) {
    e.preventDefault();
    const btn = document.getElementById('btn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Logging in...';
    msg.className = 'msg';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Login failed');

      msg.className = 'msg ok';
      msg.textContent = '✓ Success! Redirecting...';
      setTimeout(() => window.location.href = '/dashboard', 800);
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Log In →';
    }
  }
</script>
</body>
</html>
