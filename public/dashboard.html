<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — TradeBridge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0D0610;--bg2:#150A1A;--card:#1A0E20;--wine:#6B1D3A;--wine-mid:#8B2252;--gold:#C9A84C;--gold-l:#E2C97E;--txt:#F5EEF2;--txt2:#D4C8CE;--muted:#A89BA3;--glass-b:rgba(201,168,76,0.1);--green:#4ADE80;--red:#F87171;--blue:#60A5FA;--orange:#FB923C}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}

  /* Toast */
  .toast-container{position:fixed;top:80px;right:20px;z-index:9999;display:flex;flex-direction:column;gap:8px}
  .toast{padding:0.8rem 1.2rem;border-radius:12px;font-size:0.85rem;font-weight:600;animation:toastIn 0.4s ease,toastOut 0.4s ease 2.6s forwards;backdrop-filter:blur(20px);border:1px solid}
  .toast.ok{background:rgba(74,222,128,0.1);color:var(--green);border-color:rgba(74,222,128,0.15)}
  .toast.err{background:rgba(248,113,113,0.1);color:var(--red);border-color:rgba(248,113,113,0.15)}
  .toast.info{background:rgba(96,165,250,0.1);color:var(--blue);border-color:rgba(96,165,250,0.15)}
  @keyframes toastIn{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:translateX(0)}}
  @keyframes toastOut{to{opacity:0;transform:translateX(40px)}}

  /* Nav */
  .topbar{height:60px;background:rgba(13,6,16,0.9);backdrop-filter:blur(20px);border-bottom:1px solid rgba(201,168,76,0.06);display:flex;align-items:center;justify-content:space-between;padding:0 2rem;position:sticky;top:0;z-index:100}
  .topbar .logo{font-family:'Playfair Display',serif;font-size:1.2rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;text-decoration:none}
  .topbar-right{display:flex;align-items:center;gap:1rem}
  .user-info{font-size:0.82rem;color:var(--txt2)}
  .user-info strong{color:var(--txt)}
  .role-badge{font-size:0.65rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;padding:0.25rem 0.6rem;border-radius:6px;margin-left:0.5rem}
  .role-badge.master{background:rgba(201,168,76,0.12);color:var(--gold)}
  .role-badge.client{background:rgba(96,165,250,0.12);color:var(--blue)}
  .btn-logout{background:none;border:1px solid var(--glass-b);color:var(--muted);padding:0.4rem 0.9rem;border-radius:8px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.3s}
  .btn-logout:hover{border-color:var(--red);color:var(--red)}

  .main{max-width:1100px;margin:0 auto;padding:2rem 1.5rem}
  .welcome{margin-bottom:2rem;animation:fadeIn 0.5s ease}
  .welcome h1{font-size:1.6rem;font-weight:800;margin-bottom:0.3rem}
  .welcome p{font-size:0.9rem;color:var(--txt2)}
  @keyframes fadeIn{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}

  .refresh-bar{display:flex;align-items:center;gap:0.5rem;font-size:0.75rem;color:var(--txt2);margin-bottom:1.5rem}
  .refresh-dot{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(74,222,128,0.4)}50%{opacity:.7;box-shadow:0 0 0 6px rgba(74,222,128,0)}}
  .btn-refresh{background:none;border:1px solid var(--glass-b);color:var(--muted);padding:0.2rem 0.6rem;border-radius:6px;font-size:0.72rem;cursor:pointer;font-family:inherit;transition:all 0.2s;margin-left:auto}
  .btn-refresh:hover{border-color:var(--gold);color:var(--gold)}

  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1rem;margin-bottom:2rem}
  .stat-card{background:var(--card);border:1px solid var(--glass-b);border-radius:14px;padding:1.3rem;transition:transform 0.3s,border-color 0.3s}
  .stat-card:hover{transform:translateY(-2px);border-color:rgba(201,168,76,0.2)}
  .stat-card .sc-label{font-size:0.72rem;font-weight:700;text-transform:uppercase;letter-spacing:0.1em;color:var(--txt2);margin-bottom:0.3rem}
  .stat-card .sc-val{font-size:1.6rem;font-weight:800}
  .stat-card .sc-val.gold{background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
  .stat-card .sc-val.green{color:var(--green)}
  .stat-card .sc-val.red{color:var(--red)}

  .section{background:var(--card);border:1px solid var(--glass-b);border-radius:16px;padding:1.8rem;margin-bottom:1.5rem}
  .section h2{font-size:1.1rem;font-weight:700;margin-bottom:1.2rem;display:flex;align-items:center;gap:0.5rem}

  .master-id-box{background:var(--bg2);border:1px solid rgba(201,168,76,0.15);border-radius:12px;padding:1.2rem;display:flex;align-items:center;justify-content:space-between;margin-bottom:1.5rem}
  .mid-label{font-size:0.78rem;color:var(--txt2);font-weight:700;text-transform:uppercase;letter-spacing:0.08em}
  .mid-val{font-size:1.4rem;font-weight:800;font-family:'Courier New',monospace;color:var(--gold);letter-spacing:0.05em}
  .btn-copy{background:rgba(201,168,76,0.1);border:1px solid rgba(201,168,76,0.2);color:var(--gold);padding:0.4rem 0.9rem;border-radius:8px;font-size:0.78rem;font-weight:600;cursor:pointer;font-family:inherit;transition:all 0.3s}
  .btn-copy:hover{background:rgba(201,168,76,0.2)}

  .btn-download{display:inline-flex;align-items:center;gap:0.5rem;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--bg);padding:0.8rem 1.5rem;border-radius:12px;font-size:0.9rem;font-weight:700;border:none;cursor:pointer;transition:transform 0.2s,box-shadow 0.3s;text-decoration:none;margin-right:0.8rem;margin-bottom:0.5rem}
  .btn-download:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,0.3)}

  .tbl{width:100%;border-collapse:collapse}
  .tbl th{text-align:left;font-size:0.7rem;font-weight:700;text-transform:uppercase;letter-spacing:0.08em;color:var(--txt2);padding:0.6rem 0.5rem;border-bottom:1px solid var(--glass-b)}
  .tbl td{font-size:0.85rem;padding:0.65rem 0.5rem;border-bottom:1px solid rgba(201,168,76,0.04);color:var(--txt)}
  .tbl tr:hover td{background:rgba(107,29,58,0.04)}
  .buy{color:var(--green);font-weight:600}.sell{color:var(--wine-mid);font-weight:600}

  /* Status indicators */
  .status-active{display:inline-flex;align-items:center;gap:0.3rem;color:var(--green);font-weight:600;font-size:0.8rem}
  .status-active::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
  .status-inactive{display:inline-flex;align-items:center;gap:0.3rem;color:var(--red);font-weight:600;font-size:0.8rem}
  .status-inactive::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--red)}

  /* Payment wall */
  .paywall{background:linear-gradient(135deg,rgba(107,29,58,0.15),rgba(201,168,76,0.08));border:1px solid rgba(201,168,76,0.2);border-radius:20px;padding:3rem 2rem;text-align:center;margin-bottom:2rem}
  .paywall h2{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:800;margin-bottom:0.5rem}
  .paywall .price-tag{font-size:2.5rem;font-weight:900;background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:1rem 0}
  .paywall p{color:var(--muted);font-size:0.9rem;margin-bottom:1.5rem;max-width:500px;margin-left:auto;margin-right:auto}
  .paywall .features-list{display:flex;flex-wrap:wrap;gap:0.8rem;justify-content:center;margin-bottom:2rem}
  .paywall .feat{background:rgba(201,168,76,0.06);border:1px solid rgba(201,168,76,0.1);padding:0.4rem 1rem;border-radius:8px;font-size:0.8rem;color:var(--gold)}
  .pay-form{max-width:400px;margin:0 auto;text-align:left}
  .pay-form label{display:block;font-size:0.78rem;font-weight:600;color:var(--txt2);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em}
  .pay-form select,.pay-form input{width:100%;padding:0.8rem 1rem;background:var(--bg2);border:1px solid var(--glass-b);border-radius:10px;color:var(--txt);font-size:0.9rem;font-family:inherit;outline:none;margin-bottom:1rem}
  .pay-form select:focus,.pay-form input:focus{border-color:var(--gold)}
  .btn-pay{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--bg);font-size:0.95rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;transition:transform 0.2s,box-shadow 0.3s}
  .btn-pay:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,0.3)}
  .btn-pay:disabled{opacity:0.5;cursor:not-allowed;transform:none}
  .pending-badge{display:inline-flex;align-items:center;gap:0.4rem;background:rgba(251,146,60,0.1);border:1px solid rgba(251,146,60,0.15);color:var(--orange);padding:0.5rem 1.2rem;border-radius:10px;font-size:0.88rem;font-weight:600}

  .empty{text-align:center;padding:2.5rem 1rem;color:var(--txt2);font-size:0.9rem}
  .loading{text-align:center;padding:3rem;color:var(--muted)}

  /* Client tabs */
  .tabs{display:flex;gap:0.5rem;margin-bottom:1.5rem}
  .tab{padding:0.5rem 1.2rem;border-radius:10px;font-size:0.85rem;font-weight:600;cursor:pointer;border:1px solid var(--glass-b);background:none;color:var(--muted);font-family:inherit;transition:all 0.3s}
  .tab.active{background:rgba(201,168,76,0.1);border-color:rgba(201,168,76,0.2);color:var(--gold)}
  .master-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:1rem}
  .m-card{background:var(--bg2);border:1px solid var(--glass-b);border-radius:14px;padding:1.5rem;transition:all 0.3s}
  .m-card:hover{border-color:rgba(201,168,76,0.25);transform:translateY(-2px)}
  .m-card .m-name{font-size:1.05rem;font-weight:700;margin-bottom:0.2rem}
  .m-card .m-id{font-size:0.78rem;color:var(--gold);font-family:monospace;margin-bottom:0.5rem}
  .m-card .m-stats{display:flex;gap:1.5rem;margin-bottom:1rem;font-size:0.78rem;color:var(--txt2)}
  .m-card .m-stats strong{color:var(--txt)}
  .btn-sub{width:100%;padding:0.65rem;border-radius:10px;font-size:0.85rem;font-weight:700;border:none;cursor:pointer;font-family:inherit;transition:all 0.2s}
  .btn-sub.connect{background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--bg)}
  .btn-sub.connected{background:rgba(74,222,128,0.1);border:1px solid rgba(74,222,128,0.15);color:var(--green);cursor:default}
  .btn-sub.unsub{background:rgba(248,113,113,0.08);border:1px solid rgba(248,113,113,0.12);color:var(--red);margin-top:0.5rem}
  .search-box{margin-bottom:1.2rem}
  .search-box input{width:100%;padding:0.7rem 1rem;background:var(--bg2);border:1px solid var(--glass-b);border-radius:10px;color:var(--txt);font-size:0.88rem;font-family:inherit;outline:none}
  .search-box input:focus{border-color:var(--gold)}
  .search-box input::placeholder{color:var(--muted)}

  @media(max-width:640px){
    .topbar{padding:0 1rem}
    .stats-row{grid-template-columns:1fr 1fr}
    .master-list{grid-template-columns:1fr}
    .master-id-box{flex-direction:column;gap:0.8rem;text-align:center}
    .user-info{display:none}
    .paywall{padding:2rem 1.2rem}
    .btn-download{width:100%;justify-content:center;margin-right:0}
  }
</style>
</head>
<body>

<div class="toast-container" id="toasts"></div>

<div class="topbar">
  <a href="/" class="logo">TradeBridge</a>
  <div class="topbar-right">
    <a href="/" style="font-size:0.78rem;color:var(--txt2);text-decoration:none;transition:color 0.2s;font-weight:600" onmouseover="this.style.color='var(--gold)'" onmouseout="this.style.color='var(--txt2)'">← Website</a>
    <div class="user-info" id="userInfo"></div>
    <button class="btn-logout" onclick="logout()">Log out</button>
  </div>
</div>

<div class="main" id="main"><div class="loading">Loading dashboard...</div></div>

<script>
let currentUser = null;

function toast(msg, type='info') {
  const c = document.getElementById('toasts');
  const t = document.createElement('div');
  t.className = 'toast ' + type;
  t.textContent = msg;
  c.appendChild(t);
  setTimeout(() => t.remove(), 3000);
}

async function init() {
  try {
    const res = await fetch('/api/me');
    if (!res.ok) { window.location.href = '/login'; return; }
    const data = await res.json();
    currentUser = data.user;

    document.getElementById('userInfo').innerHTML =
      '<strong>' + currentUser.name + '</strong> <span class="role-badge ' + currentUser.role + '">' + currentUser.role + '</span>';

    if (currentUser.role === 'master') renderMasterDashboard();
    else renderClientDashboard();
  } catch {
    window.location.href = '/login';
  }
}

// ═══════════ MASTER DASHBOARD ═══════════
async function renderMasterDashboard() {
  const res = await fetch('/api/master/dashboard');
  const data = await res.json();

  if (!data.is_paid) {
    // Check if payment is pending
    renderPaywall(data);
    return;
  }

  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <h1>👑 Master Dashboard</h1>
      <p>Manage your trade broadcast and monitor connected clients</p>
    </div>

    <div class="refresh-bar">
      <span class="refresh-dot"></span> Live — Auto-refreshes every 15s
      <button class="btn-refresh" onclick="renderMasterDashboard();toast('Refreshed','ok')">↻ Refresh</button>
    </div>

    <div class="master-id-box">
      <div>
        <div class="mid-label">Your Master ID</div>
        <div class="mid-val">${data.master_id}</div>
      </div>
      <button class="btn-copy" onclick="copyId('${data.master_id}')">📋 Copy ID</button>
    </div>

    <div class="stats-row">
      <div class="stat-card">
        <div class="sc-label">Total Clients</div>
        <div class="sc-val gold">${data.client_count}</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Active Now</div>
        <div class="sc-val green">${data.active_count}</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Inactive</div>
        <div class="sc-val red">${data.inactive_count}</div>
      </div>
      <div class="stat-card">
        <div class="sc-label">Total Trades</div>
        <div class="sc-val">${data.trade_count}</div>
      </div>
    </div>

    <div class="section">
      <h2>📥 Download EA Files</h2>
      <p style="font-size:0.88rem;color:var(--txt2);margin-bottom:1rem">
        Your Master ID: <strong style="color:var(--gold)">${data.master_id}</strong> — Enter this in the EA input settings when attaching to chart.
      </p>
      <a href="/api/download/master-ea" class="btn-download" onclick="toast('Downloading MasterEA.ex5...','ok')">⬇ MasterEA.ex5</a>
      <a href="/api/download/client-ea" class="btn-download" onclick="toast('Downloading ClientEA.ex5...','ok')">⬇ ClientEA.ex5</a>
      <p style="font-size:0.8rem;color:var(--txt2);margin-top:0.5rem">Give the ClientEA.ex5 file + your Master ID to your clients. They enter the ID in EA settings.</p>
    </div>

    <div class="section">
      <h2>👥 Connected Clients (${data.client_count})</h2>
      ${data.clients.length ? `
        <div style="overflow-x:auto">
        <table class="tbl">
          <tr><th>Client ID</th><th>Account</th><th>Broker</th><th>Acc #</th><th>Balance</th><th>Status</th><th>Last Seen</th></tr>
          ${data.clients.map(c => `
            <tr>
              <td style="color:var(--gold);font-family:monospace;font-size:0.78rem">${c.client_uid}</td>
              <td style="color:var(--txt);font-weight:600">${c.account_name || '—'}</td>
              <td>${c.broker || '—'}</td>
              <td>${c.account_number || '—'}</td>
              <td>${c.balance ? '$' + parseFloat(c.balance).toLocaleString() : '—'}</td>
              <td>${c.is_active ? '<span class="status-active">Active</span>' : '<span class="status-inactive">Offline</span>'}</td>
              <td style="font-size:0.78rem">${timeAgo(c.last_heartbeat)}</td>
            </tr>
          `).join('')}
        </table>
        </div>
      ` : '<div class="empty">No clients connected yet. Distribute the ClientEA.ex5 file to your clients to get started.</div>'}
    </div>

    <div class="section">
      <h2>📊 Recent Trades</h2>
      ${data.recent_trades.length ? `
        <div style="overflow-x:auto">
        <table class="tbl">
          <tr><th>#</th><th>Symbol</th><th>Action</th><th>Volume</th><th>Price</th><th>Time</th></tr>
          ${data.recent_trades.map(t => `
            <tr>
              <td style="color:var(--muted)">${t.id}</td>
              <td style="color:var(--txt);font-weight:600">${t.symbol}</td>
              <td class="${t.action?.toLowerCase().includes('buy') ? 'buy' : 'sell'}">${t.action}</td>
              <td>${t.volume}</td>
              <td>${t.price}</td>
              <td>${new Date(t.created_at).toLocaleString()}</td>
            </tr>
          `).join('')}
        </table>
        </div>
      ` : '<div class="empty">No trades yet. Attach MasterEA.ex5 to your MT5 chart and start trading.</div>'}
    </div>
  `;
}

function renderPaywall(data) {
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <h1>👑 Master Dashboard</h1>
      <p>Your Master ID: <strong style="color:var(--gold)">${data.master_id}</strong></p>
    </div>

    <div class="paywall">
      <h2>Activate Your Master Account</h2>
      <div class="price-tag">$200</div>
      <p>One-time payment to unlock your Master Panel, download EA files, and start broadcasting trades to unlimited clients.</p>

      <div class="features-list">
        <span class="feat">✦ Master EA + Client EA</span>
        <span class="feat">✦ Unlimited Clients</span>
        <span class="feat">✦ Live Client Tracking</span>
        <span class="feat">✦ Active/Inactive Status</span>
        <span class="feat">✦ Trade History</span>
        <span class="feat">✦ Real-time Dashboard</span>
      </div>

      <div class="pay-form" id="payForm">
        <label>Payment Method</label>
        <select id="payMethod">
          <option value="">Select method...</option>
          <option value="upi">UPI / Bank Transfer</option>
          <option value="crypto">Crypto (USDT/BTC)</option>
          <option value="paypal">PayPal</option>
          <option value="card">Credit/Debit Card</option>
          <option value="other">Other</option>
        </select>

        <label>Transaction ID / Reference</label>
        <input type="text" id="payRef" placeholder="Enter your payment reference...">

        <button class="btn-pay" id="payBtn" onclick="submitPayment()">Submit Payment Proof →</button>
      </div>

      <div id="payMsg" style="margin-top:1rem"></div>
    </div>
  `;
}

async function submitPayment() {
  const method = document.getElementById('payMethod').value;
  const reference = document.getElementById('payRef').value.trim();
  const btn = document.getElementById('payBtn');
  const msg = document.getElementById('payMsg');

  if (!method || !reference) { toast('Select method and enter reference', 'err'); return; }

  btn.disabled = true;
  btn.textContent = 'Submitting...';

  try {
    const res = await fetch('/api/payment/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ method, reference })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error);

    msg.innerHTML = '<div class="pending-badge">⏳ Payment submitted! Your account will be activated within 24 hours.</div>';
    btn.style.display = 'none';
    toast('Payment proof submitted!', 'ok');
  } catch (err) {
    toast(err.message, 'err');
    btn.disabled = false;
    btn.textContent = 'Submit Payment Proof →';
  }
}

// ═══════════ CLIENT DASHBOARD ═══════════
let clientTab = 'browse';
let searchQuery = '';

async function renderClientDashboard() {
  document.getElementById('main').innerHTML = `
    <div class="welcome">
      <h1>📡 Client Dashboard</h1>
      <p>Browse and connect to master traders</p>
    </div>
    <div class="tabs">
      <button class="tab ${clientTab==='browse'?'active':''}" onclick="switchTab('browse')">Browse Masters</button>
      <button class="tab ${clientTab==='my'?'active':''}" onclick="switchTab('my')">My Connections</button>
    </div>
    <div id="tabContent"><div class="loading">Loading...</div></div>
  `;
  if (clientTab === 'browse') loadBrowse();
  else loadMyMasters();
}

function switchTab(t) { clientTab = t; renderClientDashboard(); }

async function loadBrowse() {
  const res = await fetch('/api/masters');
  const data = await res.json();
  const myRes = await fetch('/api/my-masters');
  const myData = await myRes.json();
  const myIds = new Set(myData.masters.map(m => m.id));

  let masters = data.masters;
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    masters = masters.filter(m => m.name.toLowerCase().includes(q) || m.master_id.toLowerCase().includes(q));
  }

  document.getElementById('tabContent').innerHTML = `
    <div class="search-box">
      <input type="text" placeholder="Search masters by name or ID..." value="${searchQuery}" oninput="searchQuery=this.value;loadBrowse()">
    </div>
    ${masters.length ? `<div class="master-list">${masters.map(m => `
      <div class="m-card">
        <div class="m-name">👑 ${m.name}</div>
        <div class="m-id">${m.master_id}</div>
        <div class="m-stats"><span>Clients: <strong>${m.client_count}</strong></span><span>Trades: <strong>${m.trade_count}</strong></span></div>
        ${myIds.has(m.id) ? '<button class="btn-sub connected" disabled>✓ Connected</button>' : `<button class="btn-sub connect" onclick="subscribe(${m.id})">Connect →</button>`}
      </div>
    `).join('')}</div>` : '<div class="empty">No masters available yet.</div>'}`;
}

async function loadMyMasters() {
  const res = await fetch('/api/my-masters');
  const data = await res.json();
  document.getElementById('tabContent').innerHTML = data.masters.length ? `
    <div class="master-list">${data.masters.map(m => `
      <div class="m-card">
        <div class="m-name">👑 ${m.name}</div>
        <div class="m-id">${m.master_id}</div>
        <div class="m-stats"><span>Trades: <strong>${m.trade_count}</strong></span></div>
        <button class="btn-sub unsub" onclick="unsubscribe(${m.id})">Disconnect</button>
      </div>
    `).join('')}</div>` : '<div class="empty">No connections yet. Browse masters to get started!</div>';
}

async function subscribe(id) {
  try {
    const r = await fetch('/api/subscribe', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({master_user_id:id}) });
    if (!r.ok) throw new Error('Failed');
    toast('Connected! 🎉', 'ok');
    renderClientDashboard();
  } catch (e) { toast('Failed: ' + e.message, 'err'); }
}

async function unsubscribe(id) {
  if (!confirm('Disconnect?')) return;
  try {
    await fetch('/api/unsubscribe', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({master_user_id:id}) });
    toast('Disconnected', 'info');
    renderClientDashboard();
  } catch (e) { toast('Failed', 'err'); }
}

// ═══════════ UTILS ═══════════
function copyId(id) { navigator.clipboard.writeText(id); toast('Master ID copied! 📋', 'ok'); }
function timeAgo(ts) {
  if (!ts) return '—';
  const diff = Date.now() - new Date(ts).getTime();
  if (diff < 60000) return 'Just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

async function logout() { await fetch('/api/logout', {method:'POST'}); window.location.href='/'; }

setInterval(() => {
  if (currentUser?.role === 'master') renderMasterDashboard();
}, 15000);

init();
</script>
</body>
</html>
