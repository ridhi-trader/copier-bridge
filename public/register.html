<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — TradeBridge</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{--bg:#0D0610;--bg2:#150A1A;--card:#1A0E20;--wine:#6B1D3A;--wine-mid:#8B2252;--gold:#C9A84C;--gold-l:#E2C97E;--txt:#F5EEF2;--txt2:#D4C8CE;--muted:#A89BA3;--glass-b:rgba(201,168,76,0.1);--green:#4ADE80;--red:#F87171}
  body{font-family:'Inter',sans-serif;background:var(--bg);color:var(--txt);min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding:2rem;position:relative;overflow-x:hidden;overflow-y:auto}

  /* Floating particles */
  .particles{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:0}
  .particle{position:absolute;border-radius:50%;opacity:0;animation:floatUp linear infinite}
  @keyframes floatUp{0%{opacity:0;transform:translateY(100vh) scale(0)}10%{opacity:1}90%{opacity:1}100%{opacity:0;transform:translateY(-10vh) scale(1)}}

  /* Ambient glow */
  .glow{position:fixed;border-radius:50%;filter:blur(140px);pointer-events:none;z-index:0}
  .glow1{width:500px;height:500px;background:radial-gradient(circle,rgba(107,29,58,0.2),transparent 70%);top:-10%;right:-5%}
  .glow2{width:400px;height:400px;background:radial-gradient(circle,rgba(201,168,76,0.06),transparent 70%);bottom:0;left:-5%}

  .content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;padding-top:1rem;padding-bottom:3rem;width:100%}
  .logo{font-family:'Playfair Display',serif;font-size:1.8rem;font-weight:800;background:linear-gradient(135deg,var(--gold),var(--gold-l));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:0.3rem;text-align:center}
  .logo-sub{font-size:0.65rem;font-weight:600;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);text-align:center;margin-bottom:2.5rem}
  .reg-box{background:var(--card);border:1px solid var(--glass-b);border-radius:20px;padding:2.5rem;width:100%;max-width:440px;backdrop-filter:blur(20px);animation:slideUp 0.6s ease}
  @keyframes slideUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:translateY(0)}}

  h2{font-size:1.3rem;font-weight:700;margin-bottom:0.4rem}
  .sub{font-size:0.88rem;color:var(--muted);margin-bottom:2rem}
  .role-pick{display:grid;grid-template-columns:1fr 1fr;gap:0.8rem;margin-bottom:1.8rem}
  .role-btn{background:var(--bg2);border:2px solid var(--glass-b);border-radius:14px;padding:1.4rem 1rem;text-align:center;cursor:pointer;transition:all 0.3s}
  .role-btn:hover{border-color:rgba(201,168,76,0.25);transform:translateY(-2px)}
  .role-btn.active{border-color:var(--gold);background:rgba(201,168,76,0.06);box-shadow:0 0 30px rgba(201,168,76,0.08)}
  .role-btn .r-icon{font-size:2rem;margin-bottom:0.5rem;transition:transform 0.3s}
  .role-btn.active .r-icon{transform:scale(1.15)}
  .role-btn .r-title{font-size:0.95rem;font-weight:700}
  .role-btn .r-desc{font-size:0.75rem;color:var(--muted);margin-top:0.3rem}
  .field{margin-bottom:1.2rem}
  .field label{display:block;font-size:0.78rem;font-weight:600;color:var(--txt2);margin-bottom:0.4rem;text-transform:uppercase;letter-spacing:0.06em}
  .input-wrap{position:relative}
  .field input{width:100%;padding:0.8rem 1rem;background:var(--bg2);border:1px solid var(--glass-b);border-radius:10px;color:var(--txt);font-size:0.92rem;font-family:inherit;outline:none;transition:border-color 0.3s,box-shadow 0.3s}
  .field input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(201,168,76,0.08)}
  .field input::placeholder{color:var(--muted)}
  .toggle-pw{position:absolute;right:12px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted);cursor:pointer;font-size:1.1rem;padding:4px;transition:color 0.2s}
  .toggle-pw:hover{color:var(--txt)}

  /* Password strength */
  .pw-strength{margin-top:0.5rem;display:flex;gap:4px;height:3px}
  .pw-bar{flex:1;border-radius:3px;background:rgba(255,255,255,0.06);transition:background 0.3s}
  .pw-bar.weak{background:var(--red)}
  .pw-bar.medium{background:#F59E0B}
  .pw-bar.strong{background:var(--green)}
  .pw-label{font-size:0.7rem;margin-top:0.3rem;transition:color 0.3s}

  .btn-submit{width:100%;padding:0.9rem;background:linear-gradient(135deg,var(--gold),var(--gold-l));color:var(--bg);font-size:0.95rem;font-weight:700;border:none;border-radius:12px;cursor:pointer;margin-top:0.5rem;transition:transform 0.2s,box-shadow 0.3s}
  .btn-submit:hover{transform:translateY(-2px);box-shadow:0 8px 30px rgba(201,168,76,0.3)}
  .btn-submit:disabled{opacity:0.5;cursor:not-allowed;transform:none;box-shadow:none}
  .btn-submit:active:not(:disabled){transform:scale(0.98)}
  .msg{text-align:center;margin-top:1rem;font-size:0.85rem;padding:0.6rem;border-radius:8px;display:none;animation:slideUp 0.3s ease}
  .msg.err{display:block;background:rgba(248,113,113,0.1);color:var(--red);border:1px solid rgba(248,113,113,0.15)}
  .msg.ok{display:block;background:rgba(74,222,128,0.1);color:var(--green);border:1px solid rgba(74,222,128,0.15)}
  .bottom{text-align:center;margin-top:1.5rem;font-size:0.85rem;color:var(--muted)}
  .bottom a{color:var(--gold);font-weight:600;transition:color 0.2s}
  .bottom a:hover{color:var(--gold-l)}
  a.back{display:inline-block;margin-bottom:1.5rem;font-size:0.85rem;color:var(--muted);text-decoration:none;transition:color 0.2s}
  a.back:hover{color:var(--txt)}
</style>
</head>
<body>

<div class="glow glow1"></div>
<div class="glow glow2"></div>
<div class="particles" id="particles"></div>

<div class="content">
<a href="/" class="back">← Back to home</a>
<div class="logo">TradeBridge</div>
<div class="logo-sub">MT5 to MT5 Trade Copier</div>

<div class="reg-box">
  <h2>Create your account</h2>
  <p class="sub">Choose your role and start in under 2 minutes</p>

  <div class="role-pick">
    <div class="role-btn active" data-role="master" onclick="pickRole('master')">
      <div class="r-icon">👑</div>
      <div class="r-title">Master</div>
      <div class="r-desc">Broadcast your trades to clients</div>
    </div>
    <div class="role-btn" data-role="client" onclick="pickRole('client')">
      <div class="r-icon">📡</div>
      <div class="r-title">Client</div>
      <div class="r-desc">Copy trades from a master</div>
    </div>
  </div>

  <form id="regForm" onsubmit="register(event)">
    <div class="field">
      <label>Full Name</label>
      <input type="text" id="name" placeholder="Your name" required>
    </div>
    <div class="field">
      <label>Email</label>
      <input type="email" id="email" placeholder="you@example.com" required>
    </div>

    <!-- MT5 Fields (Master only) -->
    <div id="masterFields" style="display:block">
      <div class="field">
        <label>MT5 Account Number</label>
        <input type="text" id="mt5Account" placeholder="e.g. 12345678" required>
      </div>
      <div class="field">
        <label>Broker Name</label>
        <input type="text" id="mt5Broker" placeholder="e.g. Exness, IC Markets, FTMO...">
      </div>
      <div class="field">
        <label>Number of Clients Needed</label>
        <div class="client-count-wrap" style="display:flex;align-items:center;gap:0.8rem">
          <input type="range" id="maxClientsSlider" min="20" max="500" value="20" step="10" oninput="updateClientCount(this.value)" style="flex:1;accent-color:var(--gold)">
          <div id="clientCountDisplay" style="background:var(--bg2);border:1px solid var(--glass-b);border-radius:8px;padding:0.5rem 1rem;font-size:1.1rem;font-weight:800;color:var(--gold);min-width:60px;text-align:center">20</div>
        </div>
        <div style="font-size:0.7rem;color:var(--muted);margin-top:0.3rem">Minimum 20 clients. Slide to select how many client slots you need.</div>
      </div>
    </div>

    <div class="field">
      <label>Password</label>
      <div class="input-wrap">
        <input type="password" id="password" placeholder="Min 6 characters" minlength="6" required oninput="checkStrength(this.value)">
        <button type="button" class="toggle-pw" onclick="togglePw()">👁</button>
      </div>
      <div class="pw-strength"><div class="pw-bar" id="b1"></div><div class="pw-bar" id="b2"></div><div class="pw-bar" id="b3"></div><div class="pw-bar" id="b4"></div></div>
      <div class="pw-label" id="pwLabel" style="color:var(--muted)"></div>
    </div>
    <button type="submit" class="btn-submit" id="submitBtn">Create Account →</button>
  </form>

  <div class="msg" id="msg"></div>
  <div class="bottom">Already have an account? <a href="/login">Log in</a></div>
</div>
</div>

<script>
  let role = 'master';

  // Particles
  (function(){
    const c=document.getElementById('particles');
    for(let i=0;i<20;i++){
      const p=document.createElement('div');
      p.className='particle';
      const s=Math.random()*3+1;
      p.style.cssText=`width:${s}px;height:${s}px;left:${Math.random()*100}%;background:${Math.random()>0.5?'rgba(201,168,76,0.4)':'rgba(107,29,58,0.5)'};animation-duration:${Math.random()*8+6}s;animation-delay:${Math.random()*5}s`;
      c.appendChild(p);
    }
  })();

  function pickRole(r) {
    role = r;
    document.querySelectorAll('.role-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[data-role="${r}"]`).classList.add('active');
    const mf = document.getElementById('masterFields');
    const mt5 = document.getElementById('mt5Account');
    if (r === 'master') {
      mf.style.display = 'block';
      mt5.required = true;
    } else {
      mf.style.display = 'none';
      mt5.required = false;
    }
  }

  function updateClientCount(val) {
    document.getElementById('clientCountDisplay').textContent = val;
  }

  function togglePw() {
    const inp = document.getElementById('password');
    const btn = event.currentTarget;
    if (inp.type === 'password') { inp.type = 'text'; btn.textContent = '🙈'; }
    else { inp.type = 'password'; btn.textContent = '👁'; }
  }

  function checkStrength(pw) {
    let score = 0;
    if (pw.length >= 6) score++;
    if (pw.length >= 10) score++;
    if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
    if (/[0-9]/.test(pw) && /[^A-Za-z0-9]/.test(pw)) score++;

    const bars = [document.getElementById('b1'),document.getElementById('b2'),document.getElementById('b3'),document.getElementById('b4')];
    const label = document.getElementById('pwLabel');
    const levels = ['','weak','medium','medium','strong'];
    const labels = ['','Weak','Fair','Good','Strong'];
    const colors = ['var(--muted)','var(--red)','#F59E0B','#F59E0B','var(--green)'];

    bars.forEach((b,i) => { b.className = 'pw-bar'; if(i < score) b.classList.add(levels[score]); });
    label.textContent = labels[score] || '';
    label.style.color = colors[score] || 'var(--muted)';
  }

  async function register(e) {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const msg = document.getElementById('msg');
    btn.disabled = true;
    btn.textContent = 'Creating...';
    msg.className = 'msg';

    try {
      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value,
          role,
          mt5_account: document.getElementById('mt5Account')?.value.trim() || '',
          mt5_broker: document.getElementById('mt5Broker')?.value.trim() || '',
          max_clients: parseInt(document.getElementById('maxClientsSlider')?.value) || 20
        })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Registration failed');

      msg.className = 'msg ok';
      msg.textContent = '✓ Account created! Redirecting...';
      setTimeout(() => window.location.href = '/dashboard', 1000);
    } catch (err) {
      msg.className = 'msg err';
      msg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Create Account →';
    }
  }
</script>
</body>
</html>
